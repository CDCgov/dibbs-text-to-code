services:
  demo-site:
    image: node:22-alpine3.22
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm i && npm run dev"
    ports:
      - "8081:8081"
    depends_on:
      - api-service
  api-service:
    image: python:3.12-slim
    platform: linux/amd64
    command: sh -c "pip install --upgrade pip && pip install --group dev && fastapi dev main.py --host 0.0.0.0 --port 8080 --reload"
    working_dir: /app
    volumes:
      - ./packages/api:/app
    ports:
      - "8080:8080"
    environment:
      - PIP_ROOT_USER_ACTION=ignore
      - ENV=local
