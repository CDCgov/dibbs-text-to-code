[project]
name = "text-to-code"
version = "0.1.0"
readme = "README.md"
dependencies = [
  "lambda-handler",
  "lxml>=6.0.2",
  "pydantic>=2.12.5",
  "sentence-transformers>=6.0.0",
  "shared-models",
  "torch",
]

[dependency-groups]
dev = ["types-lxml>=2026.2.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_code"]

[tool.uv.sources]
lambda-handler = { workspace = true }
shared-models = { workspace = true }
