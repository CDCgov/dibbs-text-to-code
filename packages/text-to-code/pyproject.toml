[project]
name = "text-to-code"
version = "0.1.0"
readme = "README.md"
dependencies = [
  "lxml>=6.0.2",
  "pydantic>=2.12.5",
  "sentence-transformers",
  "torch>=2.9.1",
]

[dependency-groups]
dev = ["types-lxml>=2026.2.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_code"]
