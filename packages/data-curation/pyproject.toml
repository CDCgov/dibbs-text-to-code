[project]
name = "data-curation"
version = "0.1.0"
readme = "README.md"
dependencies = [
  "en_core_web_sm",
  "python-dotenv",
  "requests",
  "spacy",
  "spacy-lookups-data",
]

[tool.uv.sources]
en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0.tar.gz" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_curation"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
ignore = [
  "T201" # print
]