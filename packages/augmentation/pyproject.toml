[project]
name = "augmentation"
version = "0.1.0"
readme = "README.md"
dependencies = ["lxml>=4.9.2", "pydantic>=2.12.3", "shared-models"]

[tool.uv.sources]
shared-models = { workspace = true }


[dependency-groups]
dev = [
  "pytest-mock>=3.15.1",
  "pytest-snapshot>=0.9.0",
  "time-machine>=3.2.0",
  "types-lxml>=2026.2.16",
  "tzdata>=2024.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/augmentation"]
