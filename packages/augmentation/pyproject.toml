[project]
name = "augmentation"
version = "0.1.0"
readme = "README.md"
dependencies = [
    "lxml>=4.9.2",
    "pydantic>=2.12.3"
]


[dependency-groups]
dev = [
    "pytest-freezegun>=0.4.2",
    "pytest-mock>=3.15.1",
    "pytest-snapshot>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/augmentation"]

