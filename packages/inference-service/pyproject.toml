[project]
name = "inference-service"
version = "0.1.0"
readme = "README.md"
dependencies = [
  "boto3>=1.43.117",
  "fastapi>=0.141.1",
  "huggingface-hub",
  "sentence-transformers==6.0.0",
  "shared-models",
  "torch",
  "uvicorn>=0.30.0",
]

[dependency-groups]
dev = ["httpx", "moto"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_service"]

[tool.uv.sources]
shared-models = { workspace = true }
