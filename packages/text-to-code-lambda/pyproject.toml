[project]
name = "text-to-code-lambda"
version = "0.1.0"
readme = "README.md"
dependencies = [
    "aws-lambda-powertools>=2.0.0",
    "boto3>=1.40.60",
    "requests-aws4auth>=1.1.3",
    "opensearch-py>=2.0.0",
]

[dependency-groups]
dev = ["aws-lambda-typing>=2.20.0", "moto"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_code_lambda"]

[tool.uv.sources]
lambda-handler = { workspace = true }