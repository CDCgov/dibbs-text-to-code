[project]
name = "text-to-code-lambda"
version = "0.1.0"
readme = "README.md"
dependencies = ["aws-lambda-typing>=2.20.0", "boto3>=1.40.60"]

[dependency-groups]
dev = ["moto"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_code_lambda"]
