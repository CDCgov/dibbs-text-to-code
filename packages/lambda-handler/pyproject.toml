[project]
name = "lambda-handler"
version = "0.1.0"
readme = "README.md"
dependencies = ["boto3>=1.40.60", "pydantic>=2.12.5"]

[dependency-groups]
dev = ["moto"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lambda_handler"]
