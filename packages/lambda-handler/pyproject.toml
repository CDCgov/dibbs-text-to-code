[project]
name = "lambda-handler"
version = "0.1.0"
readme = "README.md"
dependencies = [
  "aws-lambda-powertools>=2.0.0",
  "aws-lambda-typing>=2.20.0",
  "boto3>=1.43.67",
  "opensearch-py>=2.0.0",
  "pydantic>=2.12.5",
  "requests-aws4auth>=1.3.2",
  "shared-models",
  "utils",
]

[dependency-groups]
dev = ["moto"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lambda_handler"]

[tool.uv.sources]
shared-models = { workspace = true }
utils = { workspace = true }
