[project]
name = "lambda-handler"
version = "0.1.0"
readme = "README.md"
dependencies = [
  "aws-lambda-typing>=2.20.0",
  "boto3>=1.40.60",
  "opensearch-py>=2.0.0",
  "pydantic>=2.12.5",
]

[dependency-groups]
dev = ["moto"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lambda_handler"]
