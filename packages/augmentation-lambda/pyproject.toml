[project]
name = "augmentation-lambda"
version = "0.1.0"
readme = "README.md"
dependencies = ["aws-lambda-powertools>=2.0.0", "structlog>=26.1.0"]

[dependency-groups]
dev = ["aws-lambda-typing>=2.20.0", "boto3>=1.43.67", "moto"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/augmentation_lambda"]

[tool.uv.sources]
lambda-handler = { workspace = true }
