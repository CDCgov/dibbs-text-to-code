[project]
name = "augmentation-lambda"
version = "0.1.0"
readme = "README.md"
dependencies = []

[dependency-groups]
dev = [
  "aws-lambda-typing>=2.20.0",
  "pytest-mock>=3.15.1",
  "pytest-snapshot>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/augmentation_lambda"]

[tool.uv.sources]
lambda-handler = { workspace = true }
