[project]
name = "augmentation-lambda"
version = "0.1.0"
readme = "README.md"
dependencies = ["aws-lambda-typing>=2.20.0"]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/augmentation_lambda"]

[tool.uv.sources]
lambda-handler = { workspace = true }
