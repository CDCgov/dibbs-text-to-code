[project]
name = "validation"
version = "0.1.0"
description = "Schematron-based eICR validation using Saxon/C and SchXSLT"
readme = "README.md"
dependencies = ["saxonche>=12.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validation"]
