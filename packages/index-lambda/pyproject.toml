[project]
name = "index-lambda"
version = "0.1.0"
readme = "README.md"
dependencies = [
    "boto3",
    "opensearch-py",
    "requests-aws4auth",
    "aws-lambda-typing>=2.20.0",
    "botocore",
    "lambda-handler",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/index_lambda"]

[tool.uv.sources]
lambda-handler = { workspace = true }
