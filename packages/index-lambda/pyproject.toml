[project]
name = "index-lambda"
version = "0.1.0"
readme = "README.md"
dependencies = [
  "aws-lambda-powertools>=2.0.0",
  "aws-lambda-typing>=2.20.0",
  "boto3",
  "botocore",
  "lambda-handler",
  "opensearch-py",
  "requests-aws4auth>=1.3.2",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/index_lambda"]

[tool.uv.sources]
lambda-handler = { workspace = true }
