name: Build and push images (dev)

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch or tag) to build from'
        required: false
        default: main
      version_tag:
        description: 'Optional Docker tag to use instead of branch name (`1.2.3`)'
        required: false
      push_ghcr:
        description: 'Push images to GitHub Container Registry (GHCR)'
        type: boolean
        default: true
      push_ttc:
        description: 'Push images to AWS TTC'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-push:
    env:
      PUSH_GHCR: ${{ github.event_name == 'push' || github.event.inputs.push_ghcr }}
      PUSH_TTC: ${{ github.event_name == 'push' || github.event.inputs.push_ttc }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # - name: Configure AIMS dev AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-region: us-east-1
      #     aws-access-key-id: ${{ secrets.AIMS_DEV_AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AIMS_DEV_AWS_SECRET_ACCESS_KEY }}

      # - name: Login to AIMS dev TTC
      #   id: ttc
      #   uses: aws-actions/amazon-ttc-login@v2

      - name: Make repo owner lowercase
        id: repo
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Determine Docker tags
        id: vars
        run: |
          # Get the branch/ref and version tag
          REF_NAME="${{ github.event.inputs.ref || github.ref_name }}"
          VERSION_TAG="${{ github.event.inputs.version_tag }}"
          # TTC_REGISTRY="${{ steps.ttc.outputs.registry }}"

          # Sanitize ref so it's a valid image tag
          if [ -z "$VERSION_TAG" ]; then
            TAG=$(echo "$REF_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          else
            TAG="$VERSION_TAG"
          fi

          echo "version_tag=$TAG" >> $GITHUB_OUTPUT

          # Define image base URLs
          declare -A BASES=(
            [LAMBDA]="lambda"
            [AUGMENTATION]="augmentation"
          )

          for IMAGE in APP LAMBDA AUGMENTATION; do
            TAGS=()

            # GHCR
            if [ "$PUSH_GHCR" = "true" ]; then
              TAGS+=("ghcr.io/${{ steps.repo.outputs.owner }}/dibbs-text-to-code/${BASES[$IMAGE]}:$TAG")
            fi

            # TTC
            # if [ "$PUSH_TTC" = "true" ]; then
            #   TAGS+=("$TTC_REGISTRY/dibbs-text-to-code/${BASES[$IMAGE]}:$TAG")
            # fi

            # Add 'latest' if on main
            if [ "$REF_NAME" = "main" ]; then
              [ "$PUSH_GHCR" = "true" ] && TAGS+=("ghcr.io/${{ steps.repo.outputs.owner }}/dibbs-text-to-code/${BASES[$IMAGE]}:latest")
              # [ "$PUSH_TTC" = "true" ] && TAGS+=("$TTC_REGISTRY/dibbs-text-to-code/${BASES[$IMAGE]}:latest")
            fi

            # Output as comma-separated string
            echo "${IMAGE,,}_tags=$(IFS=, ; echo "${TAGS[*]}")" >> $GITHUB_OUTPUT
          done

      - name: Debug Docker tags
        run: |
          echo "LAMBDA_TAGS: ${{ steps.vars.outputs.lambda_tags }}"
          echo "AUGMENTATION_TAGS: ${{ steps.vars.outputs.augmentation_tags }}"

      - name: Build and push TTC Lambda image
        uses: docker/build-push-action@v6
        with:
          context: .
          provenance: false
          file: Dockerfile.lambda
          push: true
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.lambda_tags }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version_tag }}

      - name: Build and push TTC Augmentation image
        uses: docker/build-push-action@v6
        with:
          context: .
          provenance: false
          file: Dockerfile.augmentation
          push: true
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.augmentation_tags }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version_tag }}
