name: Build and push images (dev)

on:
  push:
    branches: [main]

  schedule:
    # Weekly rebuild so AWS-published base-image patches land without
    # waiting for a code change. Mondays 10:00 UTC (6 AM ET / 3 AM PT).
    - cron: "0 10 * * 1"

  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
      version_tag:
        description: Optional Docker tag
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  detect-bump:
    # Skip dev builds on commits that bump the root pyproject.toml version;
    # those commits are owned end-to-end by the `release` workflow.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: detect
        shell: python
        run: |
          import os
          import subprocess
          import tomllib


          def read_version(text: str) -> str:
              return tomllib.loads(text)["project"]["version"]


          with open("pyproject.toml", "rb") as fh:
              new_version = read_version(fh.read().decode())

          try:
              old_raw = subprocess.check_output(
                  ["git", "show", "HEAD^:pyproject.toml"],
                  stderr=subprocess.DEVNULL,
              ).decode()
              old_version = read_version(old_raw)
          except (subprocess.CalledProcessError, KeyError):
              old_version = None

          is_release = "true" if (old_version is not None and new_version != old_version) else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"is_release={is_release}\n")

  build:
    needs: detect-bump
    # Run unconditionally on schedule and workflow_dispatch; on `push`, only
    # run when detect-bump determines this is NOT a release commit.
    if: |
      always() &&
      (github.event_name != 'push' || needs.detect-bump.outputs.is_release != 'true')
    uses: ./.github/workflows/_build-and-push.yml
    secrets: inherit
    with:
      ref: ${{ github.event.inputs.ref || github.ref }}
      extra_tag: ${{ github.event.inputs.version_tag || '' }}
      tag_branch: true
      tag_latest: ${{ github.ref_name == 'main' }}
