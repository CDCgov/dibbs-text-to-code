name: Build and push images (dev)

on:
  push:
    branches: [main]

  schedule:
    # Weekly rebuild so AWS-published base-image patches land without
    # waiting for a code change. Mondays 10:00 UTC (6 AM ET / 3 AM PT).
    - cron: "0 10 * * 1"

  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
      version_tag:
        description: Optional Docker tag
        required: false
      no_cache:
        description: >-
          Build without layer cache so OS package patches are picked up.
          Disable only when rebuilding for a code change.
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  detect-bump:
    # Skip dev builds on commits that bump the root pyproject.toml version;
    # those commits are owned end-to-end by the `release` workflow.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: detect
        run: python3 .github/scripts/detect_version_bump.py

  build:
    needs: detect-bump
    # Run unconditionally on schedule and workflow_dispatch; on `push`, only
    # run when detect-bump determines this is NOT a release commit.
    if: |
      always() &&
      (github.event_name != 'push' || needs.detect-bump.outputs.is_release != 'true')
    uses: ./.github/workflows/_build-and-push.yml
    secrets: inherit
    with:
      ref: ${{ github.event.inputs.ref || github.ref }}
      extra_tag: ${{ github.event.inputs.version_tag || '' }}
      tag_branch: true
      tag_latest: ${{ github.ref_name == 'main' }}
      # The weekly rebuild exists to pick up base-image/OS patches, which a
      # cached `microdnf update` layer silently skips — so bust the cache on
      # schedule and (by default) on manual dispatch. Push builds stay cached.
      no_cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.no_cache != 'false') }}
