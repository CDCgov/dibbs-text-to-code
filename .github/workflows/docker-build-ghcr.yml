name: Build and push Text to Code images to GHCR

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch or tag) to build from'
        required: false
        default: main
      version_tag:
        description: 'Optional Docker tag to use instead of branch name (`1.2.3`)'
        required: false

permissions:
  contents: read

jobs:
  app-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test TTC app build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          push: false
          build-args: |
            VITE_GIT_HASH=${{ github.sha }}
            VITE_GIT_BRANCH=${{ github.event.inputs.ref || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lambda-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test TTC Lambda build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lambda
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push:
    runs-on: ubuntu-latest
    needs:
      - app-build
      - lambda-build
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make repo owner lowercase
        id: repo
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Determine Docker tags
        id: vars
        run: |
          REF_NAME="${{ github.event.inputs.ref || github.ref_name }}"
          INPUT_VERSION_TAG="${{ github.event.inputs.version_tag }}"
          SCRIPT_VERSION_TAG="$(dev_scripts/version_name.sh)"

          if [ -n "$INPUT_VERSION_TAG" ]; then
            TAG="$INPUT_VERSION_TAG"
          elif [ -n "$SCRIPT_VERSION_TAG" ]; then
            TAG="$SCRIPT_VERSION_TAG"
          else
            TAG="$(echo "$REF_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')"
          fi

          if [ "$REF_NAME" = "main" ]; then
            echo "app_tags=ghcr.io/${{ steps.repo.outputs.owner }}/dibbs-text-to-code/api:$TAG,ghcr.io/${{ steps.repo.outputs.owner }}/dibbs-text-to-code/api:latest" >> $GITHUB_OUTPUT
          else
            echo "app_tags=ghcr.io/${{ steps.repo.outputs.owner }}/dibbs-text-to-code/api:$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Build and push TTC app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          push: true
          tags: ${{ steps.vars.outputs.app_tags }}
          build-args: |
            VITE_GIT_HASH=${{ github.sha }}
            VITE_GIT_BRANCH=${{ github.event.inputs.ref || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push TTC Lambda image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lambda
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.owner }}/dibbs-text-to-code/lambda:${{ steps.vars.outputs.version_tag }}
          build-args: |
            VITE_GIT_HASH=${{ github.sha }}
            VITE_GIT_BRANCH=${{ github.event.inputs.ref || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push TTC Augmentation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.augmentation
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.owner }}/dibbs-text-to-code/augmentation:${{ steps.vars.outputs.version_tag }}
          build-args: |
            VITE_GIT_HASH=${{ github.sha }}
            VITE_GIT_BRANCH=${{ github.event.inputs.ref || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
