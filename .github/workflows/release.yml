name: release

# Triggered on every push to `main`. Detects whether the merge commit bumps
# the `version` field in the root `pyproject.toml`. If yes, tags the merge
# commit, builds all three Lambda images, pushes them to GHCR and APHL ECR
# with vX.Y.Z / vX.Y / vX / latest tags, publishes a GitHub Release with
# auto-generated PR notes, and posts the link to Slack.
#
# The full release happens in a single workflow run; we do not rely on the
# tag-push trigger (GITHUB_TOKEN-created tags do not fan out to other
# workflows).

on:
  push:
    branches: [main]

jobs:
  detect-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
      version: ${{ steps.detect.outputs.version }}
      minor: ${{ steps.detect.outputs.minor }}
      major: ${{ steps.detect.outputs.major }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: detect
        shell: python
        run: |
          import os
          import re
          import subprocess
          import sys
          import tomllib


          def read_version(text: str) -> str:
              return tomllib.loads(text)["project"]["version"]


          with open("pyproject.toml", "rb") as fh:
              new_version = read_version(fh.read().decode())

          try:
              old_raw = subprocess.check_output(
                  ["git", "show", "HEAD^:pyproject.toml"],
                  stderr=subprocess.DEVNULL,
              ).decode()
              old_version = read_version(old_raw)
          except (subprocess.CalledProcessError, KeyError):
              old_version = None

          is_release = old_version is not None and new_version != old_version

          outputs = {"is_release": "false", "version": "", "minor": "", "major": ""}

          if is_release:
              if not re.fullmatch(r"\d+\.\d+\.\d+", new_version):
                  sys.exit(
                      f"version '{new_version}' is not a strict vX.Y.Z; "
                      "pre-release suffixes are not allowed for releases."
                  )
              major, minor, _ = new_version.split(".")
              outputs["is_release"] = "true"
              outputs["version"] = f"v{new_version}"
              outputs["minor"] = f"v{major}.{minor}"
              outputs["major"] = f"v{major}"
              print(f"Detected release: {old_version} -> {new_version}")
          else:
              print(f"No version bump (version={new_version}). Skipping release.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for key, value in outputs.items():
                  fh.write(f"{key}={value}\n")

      - name: Tag merge commit (idempotent)
        if: steps.detect.outputs.is_release == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          REMOTE_LINE=$(git ls-remote --tags origin "refs/tags/${VERSION}" || true)
          REMOTE_SHA=$(echo "$REMOTE_LINE" | awk '{print $1}')
          if [ -z "$REMOTE_SHA" ]; then
            echo "Creating tag ${VERSION} at ${GITHUB_SHA}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION}" -m "Release ${VERSION}" "${GITHUB_SHA}"
            git push origin "${VERSION}"
          elif [ "$REMOTE_SHA" = "$GITHUB_SHA" ]; then
            echo "Tag ${VERSION} already exists at ${GITHUB_SHA}; continuing (re-run)."
          else
            echo "::error::Tag ${VERSION} already exists at ${REMOTE_SHA}, not ${GITHUB_SHA}. Refusing to overwrite."
            exit 1
          fi

  build:
    needs: detect-release
    if: needs.detect-release.outputs.is_release == 'true'
    uses: ./.github/workflows/_build-and-push.yml
    secrets: inherit
    with:
      version_tag: ${{ needs.detect-release.outputs.version }}
      minor_tag: ${{ needs.detect-release.outputs.minor }}
      major_tag: ${{ needs.detect-release.outputs.major }}
      tag_latest: true
      tag_branch: false

  release:
    needs: [detect-release, build]
    if: needs.detect-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create or fetch GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Try to create the release. If it already exists (e.g. on a re-run),
          # fall back to fetching the existing release's URL so the workflow
          # remains idempotent.
          response=$(curl --silent --show-error \
            -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d @- "https://api.github.com/repos/${REPO}/releases" <<EOF
          {
            "tag_name": "${VERSION}",
            "target_commitish": "main",
            "name": "${VERSION}",
            "generate_release_notes": true,
            "draft": false
          }
          EOF
          )
          html_url=$(echo "$response" | jq -r '.html_url // empty')
          if [ -z "$html_url" ] || [ "$html_url" = "null" ]; then
            echo "Release creation did not return an html_url; checking for existing release."
            existing=$(curl --silent --show-error --fail \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/tags/${VERSION}")
            html_url=$(echo "$existing" | jq -r '.html_url')
          fi
          echo "Release URL: $html_url"
          echo "RELEASE_URL=$html_url" >> "$GITHUB_ENV"

      - name: Post release to Slack
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ":package: A new release has been created: <${{ env.RELEASE_URL }}|${{ needs.detect-release.outputs.version }}>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":package: A new release has been created: <${{ env.RELEASE_URL }}|${{ needs.detect-release.outputs.version }}>"
