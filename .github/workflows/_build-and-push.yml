name: Build and push images (reusable)

# Reusable workflow that builds all three Lambda images and pushes them to
# GHCR and APHL ECR. Invoked from `docker-image-push.yml` (dev) and
# `release.yml` (versioned releases).
#
# Callers pass `secrets: inherit` so the workflow can use HF_TOKEN, the APHL
# AWS credentials, and the APHL ECR repository URL.

on:
  workflow_call:
    inputs:
      version_tag:
        description: Full semver tag, e.g. v0.2.0 (release runs only)
        type: string
        required: false
        default: ""
      minor_tag:
        description: Major.minor tag, e.g. v0.2 (release runs only)
        type: string
        required: false
        default: ""
      major_tag:
        description: Major tag, e.g. v0 (release runs only)
        type: string
        required: false
        default: ""
      tag_latest:
        description: Whether to emit the :latest tag
        type: boolean
        required: false
        default: true
      tag_branch:
        description: Whether to emit the branch-name tag (dev runs)
        type: boolean
        required: false
        default: false
      extra_tag:
        description: Optional ad-hoc tag (used by workflow_dispatch in dev flow)
        type: string
        required: false
        default: ""
      ref:
        description: Git ref to check out (defaults to the calling workflow's ref)
        type: string
        required: false
        default: ""
      no_cache:
        description: >-
          Build without layer cache. Required when the goal is picking up OS
          package patches: the `microdnf update` layer is keyed on the base
          image digest, so cached builds silently skip repo updates (e.g.
          AL2023 security patches) published since the layer was first built.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: index
            dockerfile: Dockerfile.index
          - name: ttc
            dockerfile: Dockerfile.ttc
          - name: augmentation
            dockerfile: Dockerfile.augmentation

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Make repo owner lowercase
        id: repo
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/dibbs-text-to-code/${{ matrix.name }}
          tags: |
            type=raw,value=${{ inputs.version_tag }},enable=${{ inputs.version_tag != '' }}
            type=raw,value=${{ inputs.minor_tag }},enable=${{ inputs.minor_tag != '' }}
            type=raw,value=${{ inputs.major_tag }},enable=${{ inputs.major_tag != '' }}
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}
            type=ref,event=branch,enable=${{ inputs.tag_branch }}
            type=raw,value=latest,enable=${{ inputs.tag_latest }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          pull: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ inputs.no_cache }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            "huggingface_token=${{ secrets.HF_TOKEN }}"

      - name: Configure APHL AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.APHL_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.APHL_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to APHL ECR
        id: aphl-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Push tags to APHL ECR
        env:
          OWNER: ${{ steps.repo.outputs.owner }}
          NAME: ${{ matrix.name }}
          APHL_ECR: ${{ secrets.APHL_ECR_REPOSITORY_URL }}
          META_JSON: ${{ steps.meta.outputs.json }}
          MINOR_TAG: ${{ inputs.minor_tag }}
          MAJOR_TAG: ${{ inputs.major_tag }}
        run: |
          set -euo pipefail
          # Re-tag and push tags the metadata action produced. APHL ECR has
          # tag immutability enabled on everything except :latest, so we skip
          # the floating vX.Y and vX tags (which would need to be re-pointed
          # on each release). GHCR still receives the full set.
          for tag in $(jq -r '.tags[]' <<< "$META_JSON"); do
            bare="${tag##*:}"
            if [ -n "$MINOR_TAG" ] && [ "$bare" = "$MINOR_TAG" ]; then
              echo "Skipping floating tag ${bare} for APHL ECR (immutable)"
              continue
            fi
            if [ -n "$MAJOR_TAG" ] && [ "$bare" = "$MAJOR_TAG" ]; then
              echo "Skipping floating tag ${bare} for APHL ECR (immutable)"
              continue
            fi
            GHCR_IMAGE="ghcr.io/${OWNER}/dibbs-text-to-code/${NAME}:${bare}"
            ECR_IMAGE="${APHL_ECR}/${NAME}:${bare}"
            echo "Pushing ${ECR_IMAGE}"
            docker pull "$GHCR_IMAGE"
            docker tag "$GHCR_IMAGE" "$ECR_IMAGE"
            docker push "$ECR_IMAGE"
          done
