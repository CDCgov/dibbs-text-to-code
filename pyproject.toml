[project]
name = "dibbs-text-to-code-root"
version = "0.1.0"
description = ""
authors = [
    { name = "Brady Fausett", email = "bradyfausett@skylight.digital" },
    { name = "Brandon Mader", email = "brandon@skylight.digital" },
    { name = "Eric Buckley", email = "ericbuckley@skylight.digital" },
    { name = "Joshua Nygaard", email = "jnygaard@skylight.digital" },
    { name = "Marcelle Goggins", email = "marcelle@skylight.digital" },
    { name = "Nick Clyde", email = "nclyde@skylight.digital" },
    { name = "Rob Mitchell", email = "robert.a.mitchell@skylight.digital" },
]
license-files = ["LICENSE"]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.13"
dependencies = []
[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest-cov>=7.0.0",
    "pytest>=8.4.2",
    "requests>=2.32.5",
    "ruff>=0.14.10",
    "ty>=0.0.10",
]


[tool.coverage.run]
source = ["packages"]
omit = ["*/__pycache__/*", "*/test_*.py", "*/tests/*"]

[tool.pytest.ini_options]
testpaths = ["packages"]
pythonpath = ["."]


[tool.ty.src]
include = [
    "packages/api/src",
    "packages/augmentation-lambda/src",
    "packages/augmentation/src",
    "packages/text-to-code/src",
    "packages/text-to-code-lambda/src",
]

[tool.ruff]
# Wholesale ignoring several directories as I do not want to have to resolve everything in one PR,
# but I would highly recommend enabling directories as we work on them, and enabling/disabling
# rules at a more granular level as needed.
exclude = [
    "__pycache__",
    ".git",
    ".pytest_cache",
    "azure_scripts",
    "data-curation",
    "data",
    "docs",
    "model-tuning",
    "packages/api",
    "packages/utils",
]
line-length = 100
indent-width = 4
target-version = "py312"
show-fixes = true
fix = true

[tool.ruff.lint]
select = [
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "DOC",  # pydoclint
    "E",    # pycodestyle error
    "F",    # Pyflakes
    "FAST", # FastAPI
    "FURB", # refurb
    "I",    # isort
    "N",    # pep8-naming
    "PL",   # Pylint
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warning
]
ignore = [
    "D100",   # undocumented-public-module
    "E501",   # line-too-long - Handled by formatter
    "RET504", # unnecessary-assign
]

[tool.ruff.lint.flake8-annotations]
# Turn off return type annotations for __init__
mypy-init-return = true

[tool.ruff.lint.isort]
# The following settings reduce the number of changes from reorder-python-imports
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D"]
# Ignore the following rules in test files
"**/test_*.py" = [
    "D101",   # undocumented-public-class
    "D102",   # undocumented-public-method
    "D103",   # undocumented-public-function
    "S101",   # assert
    "ANN201", # missing-return-type-annotation
    "ANN001", # missing type annotation for arguments from fixtures
]
"**/conftest.py" = [
    "PT003", # pytest-extraneous-scope-function"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv.workspace]
members = [
    "packages/api",
    "packages/augmentation",
    "packages/augmentation-lambda",
    "packages/data-curation",
    "packages/text-to-code",
    "packages/text-to-code-lambda",
    "packages/utils",
    "packages/shared-models",
]
