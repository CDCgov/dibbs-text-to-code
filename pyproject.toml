[project]
name = "dibbs-text-to-code"
version = "0.1.0"
description = ""
authors = [
    { name = "Brady Fausett", email = "bradyfausett@skylight.digital" },
    { name = "Brandon Mader", email = "brandon@skylight.digital" },
    { name = "Eric Buckley", email = "ericbuckley@skylight.digital" },
    { name = "Joshua Nygaard", email = "jnygaard@skylight.digital" },
    { name = "Marcelle Goggins", email = "marcelle@skylight.digital" },
]
license-files = ["LICENSE"]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.13"
[dependency-groups]
dev = [
    "pre-commit",
    "pytest-cov",
    "pytest",
    "requests",
    "ruff",
    "ty",
]

[tool.coverage.run]
source = ["packages"]
omit = [
    "*/__pycache__/*",
    "*/test_*.py",
    "*/tests/*",
]


[tool.ty.src]
include=[
    "packages/api/src",
    "packages/aws-lambda/src"
]

[tool.ruff]
exclude = [".git", ".pytest_cache", "__pycache__", "docs"]
line-length = 100
indent-width = 4
target-version = "py312"
show-fixes = true
fix = true

[tool.ruff.lint]
select = [
    # "ALL",
    "C420",
    "COM812",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D202",
    "D212",
    "D300",
    "E4",
    "E7",
    "E9",
    "F",
    "FURB122",
    "I",
    "I001",
    "PLR1736",
    "PTH201",
    "RET502",
    "RET505",
    "RUF100",
    "SIM118",
    "UP006",
    "UP007",
    "UP015",
    "UP017",
    "UP045",
    ]

ignore = [
    "AIR",
    "CPY",
    "D100",
    "DJ",
    "DTZ",
    "FBT",
    "PD",
    "S",
    "T20",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D"]
# Ignore various rules in test modules.
"**/test_*.py" = [
    "ANN001",
    "ARG002",
    "D100",
    "D101",
    "D102",
    "D103",
    "SLF",
]

# configure docstring checking to use Google style
[tool.ruff.lint.pydocstyle]
convention = "google"

# Allow `__init__` to not have a return type
[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.isort]
# The following settings reduce the number of changes from reorder-python-imports
force-single-line = true
order-by-type = false

[tool.uv.workspace]
members = [
    "packages/api",
    "packages/aws-lambda",
    "packages/data-curation",
    "packages/utils"
    ]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dibbs_text_to_code"]
